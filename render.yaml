# Render Blueprint for the API (free plan). The storefront deploys separately on Vercel.
# Values marked `sync: false` are asked for when the Blueprint is first created.
services:
  - type: web
    name: edwaso-api
    runtime: node
    plan: free
    rootDir: server
    # NODE_ENV=production would make a plain `npm ci` skip typescript, which the build needs.
    buildCommand: npm ci --include=dev && npm run build
    # `npm start` reads a local .env file; on Render the variables come from the dashboard.
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Must be the key that encrypted the admins' 2FA secrets: when the database was copied
      # with `npm run copy-db`, use the value from that environment's .env.
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Uploaded images must live off-box: this plan's disk is wiped on every restart.
      - key: CLOUDINARY_URL
        sync: false
      # The Vercel storefront URL, exactly, with no trailing slash, e.g. https://edwaso.vercel.app
      - key: CLIENT_URL
        sync: false
      # This service's own URL, e.g. https://edwaso-api.onrender.com
      - key: PUBLIC_API_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
